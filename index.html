<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexAmnezia - AmneziaWG Config Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>NexAmnezia</h1>
        <p>AmneziaWG 2.0 Config Generator</p>
    </header>

    <main>

        <section class="card">
            <h2>Server Settings</h2>

            <label for="server">IP / Domain</label>
            <input
                type="text"
                id="server"
                placeholder="Example: 1.2.3.4"
            >

            <label for="port">Port</label>
            <input
                type="number"
                id="port"
                min="1"
                max="65535"
                placeholder="Example: 51820"
            >

            <label for="mtu">MTU</label>
            <input
                type="number"
                id="mtu"
                min="576"
                max="9000"
                value="1280"
            >

            <label for="address">Client Address</label>
            <input
                type="text"
                id="address"
                value="10.0.0.2/32"
            >

            <label for="dns">DNS</label>
            <input
                type="text"
                id="dns"
                value="1.1.1.1"
            >
        </section>


        <section class="card">
            <h2>AmneziaWG Parameters</h2>

            <label for="jc">Jc</label>
            <input
                type="number"
                id="jc"
                min="0"
                max="128"
                value="5"
            >

            <label for="jmin">Jmin</label>
            <input
                type="number"
                id="jmin"
                min="0"
                max="65535"
                value="50"
            >

            <label for="jmax">Jmax</label>
            <input
                type="number"
                id="jmax"
                min="0"
                max="65535"
                value="1000"
            >

            <label for="s1">S1</label>
            <input
                type="number"
                id="s1"
                min="0"
                max="65535"
                value="0"
            >

            <label for="s2">S2</label>
            <input
                type="number"
                id="s2"
                min="0"
                max="65535"
                value="0"
            >

            <label for="s3">S3</label>
            <input
                type="number"
                id="s3"
                min="0"
                max="65535"
                value="0"
            >

            <label for="s4">S4</label>
            <input
                type="number"
                id="s4"
                min="0"
                max="65535"
                value="0"
            >
        </section>


        <section class="card">
            <h2>Header Parameters</h2>

            <label for="h1">H1</label>
            <input
                type="text"
                id="h1"
                value="1"
                placeholder="Example: 1-4294967295"
            >

            <label for="h2">H2</label>
            <input
                type="text"
                id="h2"
                value="2"
                placeholder="Example: 2"
            >

            <label for="h3">H3</label>
            <input
                type="text"
                id="h3"
                value="3"
                placeholder="Example: 3"
            >

            <label for="h4">H4</label>
            <input
                type="text"
                id="h4"
                value="4"
                placeholder="Example: 4"
            >
        </section>


        <section class="card">
            <h2>Amnezia I Parameters</h2>

            <p class="help">
                Optional protocol-specific parameters. Leave empty if not required.
            </p>

            <label for="i1">I1</label>
            <input
                type="text"
                id="i1"
                placeholder="Optional"
            >

            <label for="i2">I2</label>
            <input
                type="text"
                id="i2"
                placeholder="Optional"
            >

            <label for="i3">I3</label>
            <input
                type="text"
                id="i3"
                placeholder="Optional"
            >

            <label for="i4">I4</label>
            <input
                type="text"
                id="i4"
                placeholder="Optional"
            >

            <label for="i5">I5</label>
            <input
                type="text"
                id="i5"
                placeholder="Optional"
            >
        </section>


        <section class="card">
            <h2>Peer Settings</h2>

            <label for="publicKey">Server Public Key</label>
            <input
                type="text"
                id="publicKey"
                placeholder="Server public key"
            >

            <label for="allowedIPs">Allowed IPs</label>
            <input
                type="text"
                id="allowedIPs"
                value="0.0.0.0/0"
            >

            <label for="keepalive">Persistent Keepalive</label>
            <input
                type="number"
                id="keepalive"
                min="0"
                max="65535"
                value="25"
            >
        </section>


        <button id="generateBtn">
            Generate Config
        </button>


        <section class="card">
            <h2>Generated Config</h2>

            <textarea
                id="config"
                rows="25"
                readonly
                placeholder="Your AmneziaWG configuration will appear here..."
            ></textarea>

            <div class="buttons">
                <button id="copyBtn">Copy</button>
                <button id="downloadBtn">Download .conf</button>
            </div>
        </section>

    </main>


    <footer>
        <p>NexAmnezia</p>
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
